server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare edge-caches for 4h by default and that overrides origin headers.
    # See CLAUDE.md — bump ?v=N on shell assets when you change them.
    location ~* \.(js|css|html|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # nginx's default mime map has no entry for .webmanifest, so it was going out
    # as application/octet-stream. `default_type` applies precisely because the
    # extension is unknown to nginx.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # The service worker must never be cached at the edge, and its scope is the
    # directory it's served from — root, which is what lets it control the whole app.
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
