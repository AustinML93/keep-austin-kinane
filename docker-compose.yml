services:
  web:
    image: nginx:alpine
    container_name: kak-web
    restart: unless-stopped
    ports:
      - "7730:80"            # 7730 = the 773 Chicago area code. Point the CF tunnel here.
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    build: ./api
    container_name: kak-api
    restart: unless-stopped
    environment:
      - POLL_INTERVAL=3600   # hourly. Polite, and announcements don't land faster than that.
      - KAK_DB=/data/kak.sqlite3
      # Consumer Key from developer.ticketmaster.com. Put it in a .env beside
      # this file — never in the repo. Without it the source simply doesn't
      # register, rather than parking a permanent error in the health readout.
      - TICKETMASTER_API_KEY=${TICKETMASTER_API_KEY:-}
      # YouTube Data API v3 key. Optional — without it the playlist still syncs
      # by scraping the page, but we can't tell a Short from a clip or detect
      # vertical video, because oEmbed reports a fixed 200x113 for everything.
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - KAK_BITS_PLAYLIST=${KAK_BITS_PLAYLIST:-}
    volumes:
      - ./data:/data         # SQLite lives here. This is the only stateful thing.
