<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keep Austin Kinane</title>
<link rel="manifest" href="/manifest.webmanifest?v=4">
<meta name="theme-color" content="#141210">
<link rel="stylesheet" href="/css/styles.css?v=4">
</head>
<body>

<!--
  Shows + shared state + push are wired. Still to come: the bit of the day, the
  curator screens, and the real voice pass on presentation.
-->

<header>
  <h1>Keep Austin Kinane</h1>
  <p id="status" class="status">checking…</p>
  <button id="push-btn" class="push">Turn on notifications</button>
</header>

<main>
  <!-- Bit of the day. Thumbnail first, tap to play — autoplay with sound is
       blocked everywhere, and nobody wants a phone that starts talking. -->
  <section id="bit" class="bit hidden">
    <h2>Bit of the day</h2>
    <div id="bit-body"></div>
  </section>

  <section id="tier1" class="tier hidden"><h2>Austin</h2><div class="rows"></div></section>
  <section id="tier2" class="tier hidden"><h2>Road trip</h2><div class="rows"></div></section>
  <section id="tier3" class="tier hidden"><h2>Daydream</h2><div class="rows"></div></section>
  <p id="empty" class="empty hidden">Nothing on the calendar.</p>

  <!--
    Manual add. Not a fallback — a first-class source. Discovery was always
    social, and this is the only thing that will ever catch a Comedy Mothership
    booking (their site blocks us, no aggregator carries them) or a drop-in.
  -->
  <details id="add-box">
    <summary>Somebody told you about a show</summary>
    <form id="add-form">
      <input name="venue" list="venue-list" placeholder="Venue (e.g. Comedy Mothership)" required>
      <datalist id="venue-list"></datalist>
      <input name="city" placeholder="City" value="Austin, TX">
      <span class="row">
        <input name="date" type="date" required>
        <input name="time" type="time">
      </span>
      <input name="ticket_url" type="url" placeholder="Ticket link (optional)">
      <input name="note" placeholder="Who told you? (optional)">
      <button type="submit">Add it</button>
      <p id="add-result"></p>
    </form>
  </details>
</main>

<section id="shelf" class="hidden">
  <h2>The shelf</h2>
  <p class="shelf-note">Full sets. For when there's an hour.</p>
  <div id="shelf-body"></div>
</section>

<footer>
  <details>
    <summary>What's being watched</summary>
    <div id="sources"></div>
  </details>
</footer>

<script src="/js/app.js?v=4"></script>
</body>
</html>
